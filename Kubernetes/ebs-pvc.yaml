apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-ebs-pvc
spec:
  accessModes:
    - ReadWriteOnce                  # ← EBS only supports RWO
  storageClassName: ebs-gp3          # ← Use our StorageClass
  resources:
    requests:
      storage: 20Gi                  # ← 20GB EBS volume
      